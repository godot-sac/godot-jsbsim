# Builds JSBSim (shared library, cached per JSBSim commit) and the GDExtension for Windows, Linux and macOS, runs the
# C++ (doctest) and Godot (GUT) tests on each, then packs addons/jsbsim with all libraries into one zip
# (tools/package_addon.py) and checks it in a new, empty project (tools/check_package.py).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            # Visual Studio 2022, the toolchain the Windows builds are made and tested with.
            os: windows-2022
            platform: windows
            jsbsim_args: ""
            scons_args: ""
            godot_zip: Godot_v4.7.2-stable_win64.exe.zip
            godot_exe: godot_bin/Godot_v4.7.2-stable_win64_console.exe
          - name: Linux
            # The oldest supported runner, so the libraries run on older glibc versions too.
            os: ubuntu-22.04
            platform: linux
            jsbsim_args: ""
            scons_args: ""
            godot_zip: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_exe: godot_bin/Godot_v4.7.2-stable_linux.x86_64
          # macOS is not in the 0.1 scope (untested); the build files support it, see docs/compatibility.md.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tools (SCons, CMake, JSBSim oracle)
        run: |
          python -m venv tools/.venv
          if [ "${{ matrix.platform }}" = "windows" ]; then PY=tools/.venv/Scripts/python.exe; else PY=tools/.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --quiet -r tools/requirements.txt

      - name: JSBSim commit
        run: echo "JSBSIM_COMMIT=$(git rev-parse HEAD:thirdparty/jsbsim)" >> "$GITHUB_ENV"

      # The JSBSim build changes only with the submodule commit or the build script; CMake rebuilds nothing then.
      - name: Cache JSBSim build
        uses: actions/cache@v4
        with:
          path: build/jsbsim
          key: jsbsim-${{ matrix.platform }}-${{ env.JSBSIM_COMMIT }}-${{ hashFiles('tools/build_jsbsim.py') }}

      - name: Build JSBSim (shared library, LGPL-2.1)
        run: '"$PY" tools/build_jsbsim.py --jobs 4 ${{ matrix.jsbsim_args }}'

      - name: Build extension (debug and release)
        run: |
          "$PY" -m SCons -j4 target=template_debug ${{ matrix.scons_args }}
          "$PY" -m SCons -j4 target=template_release ${{ matrix.scons_args }}
          rm -f addons/jsbsim/bin/${{ matrix.platform }}/*.exp addons/jsbsim/bin/${{ matrix.platform }}/*.lib
          ls -la addons/jsbsim/bin/${{ matrix.platform }}

      - name: C++ unit tests (doctest)
        run: '"$PY" -m SCons tests'

      - name: Download Godot
        run: |
          Z="${{ matrix.godot_zip }}"; R="--retry 5 --retry-all-errors --retry-delay 10"; curl -sSfL $R -o godot.zip "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=${Z#Godot_v${GODOT_VERSION}-stable_}" || curl -sSfL $R -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$Z"
          if [ "${{ matrix.platform }}" = "windows" ]; then "$PY" -m zipfile -e godot.zip godot_bin; else unzip -q godot.zip -d godot_bin; fi
          chmod +x "${{ matrix.godot_exe }}"
          echo "GODOT=$PWD/${{ matrix.godot_exe }}" >> "$GITHUB_ENV"

      # A fresh checkout has no .godot/, so this import discovers the extension mid-session: its exit code checks
      # the workaround for godotengine/godot#111048 (src/editor_first_load_guard.cpp).
      - name: Godot tests (GUT)
        run: |
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . -s addons/gut/gut_cmdln.gd

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: addons/jsbsim/bin/${{ matrix.platform }}
          if-no-files-found: error

  package:
    name: Addon package
    needs: build
    runs-on: ubuntu-22.04
    env:
      GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Pack addons/jsbsim (all platforms)
        run: |
          for platform in windows linux; do
            mkdir -p "addons/jsbsim/bin/$platform"
            cp -r "artifacts/bin-$platform/." "addons/jsbsim/bin/$platform/"
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 tools/package_addon.py --version "$VERSION" --platforms windows,linux
          python3 -m zipfile -l "build/package/godot-jsbsim-$VERSION.zip"
      - name: Check the package in a new project (Linux)
        run: |
          Z="${GODOT_ZIP}"; R="--retry 5 --retry-all-errors --retry-delay 10"; curl -sSfL $R -o godot.zip "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=${Z#Godot_v${GODOT_VERSION}-stable_}" || curl -sSfL $R -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$Z"
          unzip -q godot.zip -d godot_bin
          python3 tools/check_package.py "build/package/godot-jsbsim-$VERSION.zip" --godot "$PWD/godot_bin/${GODOT_ZIP%.zip}"
      - uses: actions/upload-artifact@v4
        with:
          name: godot-jsbsim-${{ env.VERSION }}
          path: build/package/godot-jsbsim-${{ env.VERSION }}.zip
          if-no-files-found: error

  # A tag vX.Y.Z makes a draft GitHub release with the checked zip and the CHANGELOG section as notes; publish it
  # by hand after a look (docs/release.md).
  release:
    name: Draft release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: godot-jsbsim-*
          path: dist
          merge-multiple: true
      - name: Create the release and attach the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls -la dist
          test -f "dist/godot-jsbsim-$VERSION.zip"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --title "godot-jsbsim $VERSION" --notes-file notes.md
          fi

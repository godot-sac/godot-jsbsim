# Builds JSBSim (shared library) and the GDExtension for Windows, Linux and macOS, runs the Godot (GUT) tests on
# Windows and Linux, then packs addons/jsbsim with all libraries as one artifact.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
            jsbsim_args: ""
            scons_args: ""
            godot_zip: Godot_v4.7.2-stable_win64.exe.zip
            godot_exe: Godot_v4.7.2-stable_win64_console.exe
          - name: Linux
            # The oldest supported runner, so the libraries run on older glibc versions too.
            os: ubuntu-22.04
            platform: linux
            jsbsim_args: ""
            scons_args: ""
            godot_zip: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_exe: Godot_v4.7.2-stable_linux.x86_64
          - name: macOS
            os: macos-latest
            platform: macos
            jsbsim_args: --arch "arm64;x86_64"
            scons_args: arch=universal
            godot_zip: ""
            godot_exe: ""
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tools (SCons, CMake, JSBSim oracle)
        run: |
          python -m venv tools/.venv
          if [ "${{ matrix.platform }}" = "windows" ]; then PY=tools/.venv/Scripts/python.exe; else PY=tools/.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --quiet -r tools/requirements.txt

      - name: Cache JSBSim build
        uses: actions/cache@v4
        with:
          path: build/jsbsim
          key: jsbsim-${{ matrix.platform }}-${{ hashFiles('.gitmodules', 'tools/build_jsbsim.py') }}-${{ github.sha }}
          restore-keys: jsbsim-${{ matrix.platform }}-${{ hashFiles('.gitmodules', 'tools/build_jsbsim.py') }}-

      - name: Build JSBSim (shared library, LGPL-2.1)
        run: '"$PY" tools/build_jsbsim.py --jobs 4 ${{ matrix.jsbsim_args }}'

      - name: Build extension (debug and release)
        run: |
          "$PY" -m SCons -j4 target=template_debug ${{ matrix.scons_args }}
          "$PY" -m SCons -j4 target=template_release ${{ matrix.scons_args }}
          rm -f addons/jsbsim/bin/${{ matrix.platform }}/*.exp addons/jsbsim/bin/${{ matrix.platform }}/*.lib
          ls -la addons/jsbsim/bin/${{ matrix.platform }}

      - name: Download Godot
        if: matrix.godot_zip != ''
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${{ matrix.godot_zip }}"
          "$PY" -m zipfile -e godot.zip godot_bin
          chmod +x "godot_bin/${{ matrix.godot_exe }}"
          echo "GODOT=$PWD/godot_bin/${{ matrix.godot_exe }}" >> "$GITHUB_ENV"

      - name: Godot tests (GUT)
        if: matrix.godot_zip != ''
        run: |
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . -s addons/gut/gut_cmdln.gd

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: addons/jsbsim/bin/${{ matrix.platform }}
          if-no-files-found: error

  package:
    name: Addon package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Assemble addons/jsbsim
        run: |
          for platform in windows linux macos; do
            mkdir -p "addons/jsbsim/bin/$platform"
            cp -r "artifacts/bin-$platform/." "addons/jsbsim/bin/$platform/"
          done
          cp LICENSE THIRD_PARTY_NOTICES.md addons/jsbsim/
          cp thirdparty/jsbsim/COPYING addons/jsbsim/COPYING.JSBSim
          find addons/jsbsim -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: godot-jsbsim-addon
          path: addons/jsbsim
